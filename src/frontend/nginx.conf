map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 80;
    server_name _;
    # Compose services may be recreated with new bridge addresses while this
    # container stays alive. Resolve through Docker DNS for every cache window.
    resolver 127.0.0.11 valid=5s ipv6=off;
    set $backend_upstream http://backend:8080;
    set $collab_upstream http://collab:8082;
    set $mcp_upstream http://mcp:3002;
    root /usr/share/nginx/html;
    index index.html;
    # Invitation/public tokens can be path segments; never log request targets.
    access_log off;
    error_log /dev/null crit;
    client_max_body_size 26m;

    location = /healthz {
        add_header Content-Type text/plain;
        return 200 'ok\n';
    }

    location = /internal { return 404; }
    location ^~ /internal/ { return 404; }
    location = /api/internal { return 404; }
    location ^~ /api/internal/ { return 404; }

    location /api/ {
        proxy_pass $backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /collab {
        proxy_pass $collab_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 75s;
        proxy_send_timeout 75s;
        proxy_buffering off;
    }

    location ~ ^/mcp(?:/|$) {
        proxy_pass $mcp_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 60s;
        add_header X-Accel-Buffering no always;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
