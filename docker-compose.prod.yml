services:
  db-migrate:
    image: migrate/migrate:v4.17.1
    restart: "no"
    env_file: .env.prod
    volumes:
      - ./src/backend/migrations:/migrations:ro
    networks:
      - whiteboard-app
    entrypoint: ["/bin/sh", "-ec"]
    command: ["migrate -path=/migrations -database=\"$${DATABASE_URL}\" up"]

  backend:
    build:
      context: ./src/backend
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file: .env.prod
    environment:
      CASBIN_MODEL_PATH: /app/configs/casbin_model.conf
      HTTP_ADDR: :8080
    networks:
      - homelab-net
      - whiteboard-app
      - edge-http-net
    depends_on:
      db-migrate:
        condition: service_completed_successfully
    expose:
      - "8080"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 6

  frontend:
    build:
      context: ./src/frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - homelab-net
      - whiteboard-app
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/healthz"]
      interval: 10s
      timeout: 3s
      retries: 6

networks:
  homelab-net:
    external: true
  whiteboard-app:
    external: true
  edge-http-net:
    external: true
